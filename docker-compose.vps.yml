# VPS stack, one compose project per edition (IQ-F9, docs/deployment-editions.md).
#
#   metrology : docker compose -p metro-intelligence            --env-file .env            -f docker-compose.vps.yml ...
#   industrial: docker compose -p metro-intelligence-industrial --env-file .env.industrial -f docker-compose.vps.yml ...
#
# Every name that must not collide between editions is derived from INSTANCE.
# With the defaults (INSTANCE=metro) the names are exactly the ones the
# metrology deployment already uses, so its volumes and routers are untouched.
# No container_name anywhere: compose derives names from the project (-p).
name: metro-intelligence

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - net_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      - net_data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      # Private demo JSONs (report summary, model lab) live outside the repo and
      # the image; mounted read-only. The empty default keeps metrology unchanged.
      - ${DEMO_PRIVATE_DIR:-./infra/demo-private-empty}:/run/demo-private:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - net_app
      - net_data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${APP_NETWORK:-metro_net_app}"
      - "traefik.http.routers.${INSTANCE:-metro}-api.rule=Host(`${PUBLIC_HOST:-metro.onkaizen.com.mx}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${INSTANCE:-metro}-api.priority=100"
      - "traefik.http.routers.${INSTANCE:-metro}-api.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE:-metro}-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.${INSTANCE:-metro}-api.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - net_app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${APP_NETWORK:-metro_net_app}"
      - "traefik.http.routers.${INSTANCE:-metro}-web.rule=Host(`${PUBLIC_HOST:-metro.onkaizen.com.mx}`)"
      - "traefik.http.routers.${INSTANCE:-metro}-web.priority=10"
      - "traefik.http.routers.${INSTANCE:-metro}-web.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE:-metro}-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.${INSTANCE:-metro}-web.loadbalancer.server.port=8080"

networks:
  # Shared with Traefik and with the other edition (reverse proxy only).
  # It already exists on the VPS (created by the metrology project); see the runbook.
  net_app:
    name: ${APP_NETWORK:-metro_net_app}
    external: true
  # Per edition and internal: one edition's backend can never reach the
  # other edition's database or object storage.
  net_data:
    name: ${INSTANCE:-metro}_net_data
    driver: bridge
    internal: true

volumes:
  pgdata:
    name: ${INSTANCE:-metro}_pgdata
  minio-data:
    name: ${INSTANCE:-metro}_minio_data
