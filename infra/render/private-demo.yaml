# IQ-F30 (plan decision D29): PRIVATE demo stack on Render, separate from the public demo.
#
# Holds the customer's converted data ONLY because the customer authorized it in writing.
# No data and no secrets live in this file: the database credentials are wired by Render
# (fromDatabase), secrets are generated by Render (generateValue) and the authorization
# reference and admin password are entered at approval time (sync: false). Parts are
# uploaded afterwards by an administrator over HTTPS (PUT /api/v1/private-datasets/<slug>).
# Withdrawal: DELETE each part, then delete these three resources.
#
# ADR-004: the line's station exports are loaded into metro-private-db from the API
# service shell with the ingest CLIs (backend/app/ingest/README.md). About 13 GB per
# million pieces with indexes, hence 30 GB of disk (Render disks grow, never shrink).
databases:
  - name: metro-private-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    diskSizeGB: 30
    ipAllowList: []

services:
  - type: web
    name: metro-private-api
    runtime: docker
    plan: starter
    region: oregon
    branch: claude/affectionate-meitner-30c3ud
    autoDeploy: true
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: private-demo
      - key: APP_EDITION
        value: industrial
      - key: LOG_LEVEL
        value: INFO
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase:
          name: metro-private-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: metro-private-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: metro-private-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: metro-private-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: metro-private-db
          property: password
      # Set to the private web URL after the first deploy.
      - key: CORS_ORIGINS
        sync: false
      # Object storage is not used by the industrial demo; placeholders satisfy the settings.
      - key: MINIO_ENDPOINT
        value: object-storage.invalid:9000
      - key: MINIO_ACCESS_KEY
        value: unused
      - key: MINIO_SECRET_KEY
        generateValue: true
      - key: MINIO_BUCKET_RAW_FILES
        value: unused
      - key: DEMO_REAL_DATASETS_DIR
        value: /tmp/private-datasets
      - key: DEMO_REAL_DATASETS_MAX_LOADED
        value: "1"
      - key: DEMO_PRIVATE_HOST_AUTHORIZATION
        sync: false
      - key: PRIVATE_DATASETS_UPLOAD_ENABLED
        value: "true"
      - key: SEED_DEMO_USER_PASSWORD
        sync: false

  - type: web
    name: metro-private-web
    runtime: static
    branch: claude/affectionate-meitner-30c3ud
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to https://<metro-private-api host>/api/v1 after the first deploy.
      - key: VITE_API_BASE_URL
        sync: false
